  <circle cx="40" cy="92" r="6" fill="none" stroke="#f5b86a" stroke-width="2.5"/>
  <circle cx="300" cy="46" r="5" fill="#a9c1ff"/>
  <circle cx="28" cy="420" r="5" fill="#a9c1ff"/>
  <circle cx="490" cy="520" r="6" fill="#ffd8a8"/>
  <path d="M470 600 l0 14 M463 607 l14 0" stroke="#ff9fc4" stroke-width="3" stroke-linecap="round"/>
