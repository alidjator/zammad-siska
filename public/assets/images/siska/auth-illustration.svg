<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514 800" width="514" height="800">
  <!-- Ilustrasi halaman login/register SISKA (mockup canvas "SISKA Login & Register"). -->
  <defs>
    <!-- Latar (warna dasar, lingkaran, garis putus-putus) memudar ke
         putih mulai x~300 sampai tepi kanan, supaya menyatu dgn panel
         form (tidak ada kesan kotak/terpisah). Kartu & bubble tidak
         ikut dipudarkan. -->
    <linearGradient id="fadeRight" gradientUnits="userSpaceOnUse" x1="290" y1="0" x2="514" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="bgMask" maskUnits="userSpaceOnUse" x="0" y="0" width="514" height="800">
      <rect width="514" height="800" fill="url(#fadeRight)"/>
    </mask>
  </defs>
  <rect width="514" height="800" fill="#ffffff"/>
  <g mask="url(#bgMask)">
    <rect width="514" height="800" fill="#f6f8fd"/>
    <circle cx="257" cy="480" r="235" fill="#edf2ff"/>
    <circle cx="257" cy="480" r="170" fill="#e4ecff"/>
    <path d="M18 560 C40 330 140 190 257 178 C390 165 486 270 496 440" fill="none" stroke="#a9c1ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 9"/>
    <path d="M60 720 C160 760 360 760 470 690" fill="none" stroke="#c9d7fb" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 9"/>
    <ellipse cx="257" cy="712" rx="200" ry="16" fill="#dfe7fb"/>
  </g>

  <!-- Dekorasi kecil -->
